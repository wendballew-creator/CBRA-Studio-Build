<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>CBRA Chat UI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1115;
      --panel: #171a21;
      --panel-2: #1f2430;
      --text: #e8ecf1;
      --muted: #a8b0bd;
      --accent: #7aa2f7;
      --border: #2a3140;
      --user: #1d3557;
      --assistant: #243b2f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .app {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }
    .topbar {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
    }
    .title {
      font-size: 1.25rem;
      font-weight: 700;
    }
    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    input, textarea, button {
      font: inherit;
    }
    input, textarea {
      width: 100%;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
    }
    textarea {
      min-height: 120px;
      resize: vertical;
    }
    button {
      background: var(--accent);
      color: #08111f;
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
    }
    button.secondary {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 16px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
    }
    .messages {
      min-height: 480px;
      max-height: 70vh;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      border-radius: 14px;
      padding: 12px 14px;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    .msg.user {
      background: var(--user);
    }
    .msg.assistant {
      background: var(--assistant);
    }
    .meta {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .composer {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }
    .sidebar-section {
      margin-bottom: 14px;
    }
    .sidebar-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      max-height: 50vh;
      overflow: auto;
      color: var(--text);
    }
    .status {
      font-size: 0.9rem;
      color: var(--muted);
    }
    @media (max-width: 860px) {
      .layout {
        grid-template-columns: 1fr;
      }
      .topbar {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="title">CBRA Chat UI</div>
      <div class="row">
        <label for="threadId">Thread</label>
        <input id="threadId" value="interaction-test-1" style="width: 220px;" />
      </div>
      <div class="row">
        <button id="loadThreadBtn" class="secondary">Load Thread</button>
      </div>
    </div>

    <div class="layout">
      <div class="panel">
        <div class="meta" id="status">Ready.</div>
        <div class="messages" id="messages"></div>

        <div class="composer">
          <textarea id="prompt" placeholder="Type a prompt for CBRA..."></textarea>
          <div class="row">
            <button id="sendBtn">Send</button>
            <button id="clearPromptBtn" class="secondary">Clear Prompt</button>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="sidebar-section">
          <div class="sidebar-title">Latest LoopCycle</div>
          <pre id="loopcycleView">No loopcycle loaded yet.</pre>
        </div>
        <div class="sidebar-section">
          <div class="sidebar-title">Thread Summary</div>
          <pre id="threadSummary">No thread loaded yet.</pre>
        </div>
      </div>
    </div>
  </div>

  <script>
    const threadIdInput = document.getElementById("threadId");
    const loadThreadBtn = document.getElementById("loadThreadBtn");
    const sendBtn = document.getElementById("sendBtn");
    const clearPromptBtn = document.getElementById("clearPromptBtn");
    const promptEl = document.getElementById("prompt");
    const messagesEl = document.getElementById("messages");
    const loopcycleView = document.getElementById("loopcycleView");
    const threadSummary = document.getElementById("threadSummary");
    const statusEl = document.getElementById("status");

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function renderMessages(messages) {
      messagesEl.innerHTML = "";
      for (const msg of messages || []) {
        const div = document.createElement("div");
        div.className = `msg ${msg.role || "assistant"}`;
        div.innerHTML = `<strong>${escapeHtml(msg.role || "assistant")}</strong>\n${escapeHtml(msg.content || "")}`;
        messagesEl.appendChild(div);
      }
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function renderThreadSummary(threadData) {
      const summary = {
        id: threadData?.id,
        messages_count: (threadData?.messages || []).length,
        loop_cycles_count: (threadData?.loop_cycles || []).length,
        drift_events_count: (threadData?.drift_events || []).length,
        current_field_id: threadData?.current_field_id || null
      };
      threadSummary.textContent = JSON.stringify(summary, null, 2);
    }

    function renderLatestLoopcycle(threadData) {
      const loopCycles = threadData?.loop_cycles || [];
      const latest = loopCycles.length ? loopCycles[loopCycles.length - 1] : null;
      loopcycleView.textContent = latest ? JSON.stringify(latest, null, 2) : "No loopcycle loaded yet.";
    }

    async function loadThread() {
      const threadId = threadIdInput.value.trim();
      if (!threadId) {
        setStatus("Enter a thread id first.");
        return;
      }

      setStatus(`Loading thread: ${threadId} ...`);
      const resp = await fetch(`/thread/${encodeURIComponent(threadId)}`);
      const data = await resp.json();

      renderMessages(data?.data?.messages || []);
      renderThreadSummary(data?.data || {});
      renderLatestLoopcycle(data?.data || {});
      setStatus(`Loaded thread: ${threadId}`);
    }

    async function sendPrompt() {
      const threadId = threadIdInput.value.trim();
      const userText = promptEl.value.trim();

      if (!threadId) {
        setStatus("Enter a thread id first.");
        return;
      }
      if (!userText) {
        setStatus("Enter a prompt first.");
        return;
      }

      setStatus(`Sending turn to ${threadId} ...`);
      sendBtn.disabled = true;

      try {
        const resp = await fetch(`/chat/${encodeURIComponent(threadId)}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            user_text: userText,
            mode: "production"
          })
        });

        const data = await resp.json();

        const threadResp = await fetch(`/thread/${encodeURIComponent(threadId)}`);
        const threadData = await threadResp.json();

        renderMessages(threadData?.data?.messages || []);
        renderThreadSummary(threadData?.data || {});
        if (data?.loopcycle) {
          loopcycleView.textContent = JSON.stringify(data.loopcycle, null, 2);
        } else {
          renderLatestLoopcycle(threadData?.data || {});
        }

        promptEl.value = "";
        setStatus(`Turn completed for ${threadId}`);
      } catch (err) {
        console.error(err);
        setStatus(`Request failed: ${err}`);
      } finally {
        sendBtn.disabled = false;
      }
    }

    loadThreadBtn.addEventListener("click", loadThread);
    sendBtn.addEventListener("click", sendPrompt);
    clearPromptBtn.addEventListener("click", () => {
      promptEl.value = "";
      promptEl.focus();
    });

    promptEl.addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
        sendPrompt();
      }
    });

    loadThread();
  </script>
</body>
</html>
