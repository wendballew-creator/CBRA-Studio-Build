name: Complete Python suite

on:
  push:
    branches:
      - main
      - "integration/**"
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile source
        run: python -m compileall -q cbra scripts
      - name: Run complete suite
        run: python -m unittest discover -s cbra -p 'test_*.py'
