<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>CBRA Studio</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 260px;
      background: #111;
      color: white;
      padding: 20px;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }

    .sidebar h1 {
      font-size: 18px;
      margin: 0 0 20px 0;
      font-weight: 600;
    }

    .sidebar label {
      font-size: 12px;
      margin-bottom: 6px;
      opacity: 0.8;
    }

    .sidebar input {
      padding: 8px;
      border-radius: 6px;
      border: none;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .sidebar button {
      padding: 10px;
      border-radius: 6px;
      border: none;
      background: #2c7be5;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    .sidebar button.secondary {
      background: #444;
      margin-top: 8px;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .log {
      flex: 1;
      overflow-y: auto;
      padding: 40px;
      box-sizing: border-box;
    }

    .message {
      margin-bottom: 24px;
      max-width: 760px;
    }

    .message.user {
      font-weight: 500;
    }

    .message.assistant {
      background: white;
      padding: 18px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    .composer {
      padding: 20px;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      gap: 12px;
    }

    textarea {
      flex: 1;
      resize: none;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 15px;
      height: 70px;
    }

    .send {
      padding: 0 20px;
      border-radius: 8px;
      border: none;
      background: #111;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <h1>CBRA Studio</h1>

    <label>Thread ID</label>
    <input id="threadId" />

    <button onclick="newThread()">New Thread</button>
    <button class="secondary" onclick="loadThread()">Reload Thread</button>
  </div>

    <label style="margin-top:16px;">Attach (.docx / .txt / .md)</label>
    <input id="file" type="file" />

  <div class="main">
    <div id="log" class="log"></div>

    <div class="composer">
      <textarea id="input" placeholder="Write here..."></textarea>
      <button class="send" onclick="send()">Send</button>
    </div>
  </div>

<script>
function uuid() {
  return crypto.randomUUID();
}

function newThread() {
  document.getElementById("threadId").value = uuid();
  document.getElementById("log").innerHTML = "";
}

async function loadThread() {
  const threadId = document.getElementById("threadId").value.trim();
  if (!threadId) return;

  const res = await fetch(`/thread/${threadId}`);

  if (!res.ok) {
    const t = await res.text();
    addMessage("assistant", `Error ${res.status}: ${t}`);
    return;
  }

  const data = await res.json();

  const log = document.getElementById("log");
  log.innerHTML = "";

  if (data.data && data.data.messages) {
    data.data.messages.forEach(m => {
      addMessage(m.role, m.content);
    });
  }
}

function addMessage(role, text) {
  const div = document.createElement("div");
  div.className = "message " + role;
  div.innerText = text;
  document.getElementById("log").appendChild(div);
  document.getElementById("log").scrollTop = document.getElementById("log").scrollHeight;
}

async function send() {
  const input = document.getElementById("input");
  const threadId = document.getElementById("threadId").value.trim();
  const fileEl = document.getElementById("file");
  if (!threadId) return;

  const text = input.value.trim();
  const file = fileEl.files && fileEl.files[0];

  if (!text && !file) return;

  addMessage("user", text || "[Attachment]");
  input.value = "";

  let res;

  if (file) {
    const form = new FormData();
    form.append("user_text", text || "");
    form.append("mode", "production");
    form.append("upload", file);

    res = await fetch(`/chat/${threadId}/file`, {
      method: "POST",
      body: form
    });

    // clear file selection after send
    fileEl.value = "";
  } else {
    res = await fetch(`/chat/${threadId}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user_text: text, mode: "production" })
    });
  }

  if (!res.ok) {
    const t = await res.text();
    addMessage("assistant", `Error ${res.status}: ${t}`);
    return;
  }

  const data = await res.json();
  addMessage("assistant", data.text || "(empty)");
}

newThread();
</script>

</body>
</html>
